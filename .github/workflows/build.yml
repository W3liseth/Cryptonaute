# Compile, teste et produit les installeurs de Cryptonaute pour Windows, Linux et macOS.
# Sur main, publie la release « vX.Y.Z » (version de Cargo.toml), tag compris, avec les
# installeurs si elle n'existe pas encore : il suffit d'incrémenter la version pour publier.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.read.outputs.version }}
      exists: ${{ steps.read.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$VERSION" ] || { echo "::error::version introuvable dans Cargo.toml"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La release v$VERSION existe déjà : pas de nouvelle publication."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION : release à publier (sur main)."
          fi

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système (Linux)
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Installeur Windows (NSIS)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pwsh scripts/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: cryptonaute-windows
          path: dist/*.exe

  linux:
    name: Paquets Linux (.deb, .rpm)
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Dépendances système
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev file patchelf rpm
      - run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: cryptonaute-linux
          path: |
            dist/*.deb
            dist/*.rpm

  macos:
    name: Installeur macOS (Apple Silicon)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: cryptonaute-macos
          path: |
            dist/*.pkg
            dist/uninstall.sh

  # Les fichiers sont joints un par un à la release : téléchargeables tels quels, sans zip.
  release:
    name: Release
    needs: [version, windows, linux, macos]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Contrôle des installeurs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd artifacts
          mv uninstall.sh "Cryptonaute_${VERSION}_macos-uninstall.sh"
          # Tous les installeurs doivent porter la version publiée.
          for f in *; do
            case "$f" in
              *"$VERSION"*) ;;
              *) echo "::error::$f ne correspond pas à la version $VERSION"; exit 1 ;;
            esac
          done
      # Signature minisign vérifiée par l'application avant toute mise à jour
      # automatique (clé publique : crates/app/updater.pub).
      - name: Signature des installeurs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY manquant"; exit 1; }
          cd artifacts
          for f in *.exe *.deb *.rpm *.pkg; do
            npx --yes @tauri-apps/cli@2 signer sign "$f"
          done
      - name: Publication de la release et du tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd artifacts
          ls -l
          gh release create "v$VERSION" * \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cryptonaute $VERSION" \
            --generate-notes
