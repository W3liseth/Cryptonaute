[package]
name = "cryptonaute-service"
description = "Service privilégié qui pilote les tunnels WireGuard de Cryptonaute (Windows, Linux, macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cryptonaute-common.workspace = true
serde_json.workspace = true
ipnet.workspace = true
anyhow.workspace = true
log.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }

[target.'cfg(windows)'.dependencies]
wireguard-nt = "0.5"
windows-service = "0.8"

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
]

[target.'cfg(unix)'.dependencies]
defguard_wireguard_rs = { version = "0.12", default-features = false }
libc = "0.2"
