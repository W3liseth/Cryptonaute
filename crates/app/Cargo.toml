[package]
name = "cryptonaute"
description = "Client WireGuard moderne pour Windows, Linux et macOS, utilisable sans droits administrateur"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cryptonaute-common.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
# Interface native (egui), rendu wgpu : DirectX 12, Metal, Vulkan ou OpenGL.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.36", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Polices du système (Segoe UI, SF Pro, Cantarell…), comme le faisait la pile CSS.
fontdb = "0.23"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
rfd = "0.17"
interprocess = "2"
# Mises à jour : client HTTPS (rustls), vérification des signatures minisign.
ureq = { version = "3", features = ["json"] }
minisign-verify = "0.2"
semver = "1"

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
