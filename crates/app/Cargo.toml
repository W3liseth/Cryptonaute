[package]
name = "cryptonaute"
description = "Client WireGuard moderne pour Windows, Linux et macOS, utilisable sans droits administrateur"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cryptonaute-common.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
base64.workspace = true
# Mises à jour : client HTTPS (rustls), vérification des signatures minisign.
ureq = { version = "3", features = ["json"] }
minisign-verify = "0.2"
semver = "1"

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
